# Cloudflare Pages project "holy-nudge": static PWA from public/ + Pages Functions in functions/.
# Secrets (npx wrangler pages secret put <NAME> --project-name holy-nudge):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (optional), OAUTH_SETUP_KEY,
#   CHMS_CLIENT_ID, CHMS_CLIENT_SECRET, TOKEN_ENC_KEY (same value as the cron worker)
name = "holy-nudge"
pages_build_output_dir = "public"
compatibility_date = "2026-11-17"

# Non-secret settings. CHMS_SUBDOMAIN makes the Pushpay approval page skip "Enter your church's subdomain".
[vars]
CHMS_SUBDOMAIN = "wildwood"

[[d1_databases]]
binding = "DB"
database_name = "holy-nudge"
# PLACEHOLDER: replace with the id printed by `npx wrangler d1 create holy-nudge`.
# Local dev (`npm run dev`, `npm run db:migrate:local`) works with the placeholder.
database_id = "81a8960b-2e43-4df3-ad54-a0d19167efca"
migrations_dir = "migrations"
